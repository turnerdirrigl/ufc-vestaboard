name: ufc-vestaboard
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Minutes ahead to look (leave at 10; use 100000 to test)"
        default: "10"
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python ufc.py
        env:
          VESTABOARD_KEY: ${{ secrets.VESTABOARD_KEY }}
          WINDOW_MIN: ${{ github.event.inputs.window || '10' }}

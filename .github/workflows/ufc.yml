name: ufc-vestaboard
on:
  schedule:
    - cron: "0 12 * * *"   # daily, in UTC
  workflow_dispatch:        # lets you run it manually to test
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python ufc.py
        env:
          UFCAL_KEY: ${{ secrets.UFCAL_KEY }}
          VESTABOARD_KEY: ${{ secrets.VESTABOARD_KEY }}
